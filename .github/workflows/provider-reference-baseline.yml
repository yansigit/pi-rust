name: Pinned provider reference baselines
on:
  workflow_dispatch:
  push:
    branches: [codex/provider-reference-baseline]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        provider: [antigravity, multiprovider, cursor]
    env:
      TERM: xterm-256color
      CURSOR_API_KEY: offline-fixture
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - name: Prepare private fixtures and the offline Bun cache path
        run: |
          mkdir -m 700 "$RUNNER_TEMP/provider-fixtures"
          echo "TMPDIR=$RUNNER_TEMP/provider-fixtures" >> "$GITHUB_ENV"
          mkdir -m 700 "$RUNNER_TEMP/provider-bun-cache"
          echo "BUN_INSTALL_CACHE_DIR=$RUNNER_TEMP/provider-bun-cache" >> "$GITHUB_ENV"
          echo "COMMON_AUTH_BUN_CACHE=$RUNNER_TEMP/provider-bun-cache" >> "$GITHUB_ENV"
      - name: Run unchanged pinned suite with its locked dependencies
        run: python3 scripts/provider-parity.py baseline "$RUNNER_TEMP/provider-references" --provider '${{ matrix.provider }}'
      - name: Retain reference evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reference-${{ matrix.provider }}
          path: |
            ${{ runner.temp }}/provider-references/*.log
            ${{ runner.temp }}/provider-references/*.json
          if-no-files-found: error
